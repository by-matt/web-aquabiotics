<body>
  <!-- REACT APP ROOT -->
  <div id="root"></div>

  <!-- PREMIUM LANDING LAYER -->
  <div id="landing-root">
      <!-- El contenido de la landing se inyectará aquí o se servirá desde landing_exp -->
      <!-- Para máxima velocidad y evitar duplicación masiva en index.html, 
           usaremos un pequeño script de detección -->
  </div>


  <script>
    // CONTROL DE DESPLIEGUE: LANDING VS APP
    function routeSync() {
        const path = window.location.pathname;
        const isHome = path === '/' || path === '/index.html' || path.includes('landing_exp');
        
        if (isHome) {
            document.body.classList.add('is-landing');
            // Si el usuario entra a la raíz, lo llevamos a la landing_exp que ya está lista en el servidor
            if (path === '/' || path === '/index.html') {
                window.location.replace('/landing_exp/');
            }
        } else {
            document.body.classList.remove('is-landing');
        }
    }

    // Ejecutar al cargar y al cambiar de ruta
    routeSync();
    window.addEventListener('popstate', routeSync);
  </script>
</body>
